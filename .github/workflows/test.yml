name: Test Database Migration Toolkit

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          for f in scripts/*.sh setup.sh install.sh tests/integration/*.sh; do
            bash -n "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done

      - name: Scripts are executable
        run: |
          status=0
          for f in scripts/*.sh setup.sh tests/integration/run.sh; do
            [ "$f" = "scripts/config_loader.sh" ] && continue   # sourced, not executed
            [ -x "$f" ] || { echo "::error file=$f::not executable"; status=1; }
          done
          exit $status

      - name: No eval or password-on-command-line in scripts
        run: |
          if grep -nE '(^|[^[:alnum:]_])eval[[:space:]]|-p"\$' scripts/*.sh; then
            echo "::error::eval / -p\"\$PASS\" must not be used; use the helpers in config_loader.sh"
            exit 1
          fi

      # Advisory for now: the existing scripts have not been cleaned up for shellcheck yet.
      - name: ShellCheck (errors only, advisory)
        continue-on-error: true
        run: shellcheck -S error scripts/*.sh setup.sh tests/integration/run.sh

  integration:
    name: Integration (MySQL ${{ matrix.mysql-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        mysql-version: ['5.7', '8.0']

    # Two real servers of the same version: "remote" (source) and "local" (target)
    services:
      mysql-remote:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mysql-local:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          mysql --version
          mysqldump --version

      - name: Run integration tests
        env:
          REMOTE_PORT: 3306
          LOCAL_PORT: 3307
          MYSQL_ROOT_PASSWORD: ci_root_password
        run: ./tests/integration/run.sh

  smoke:
    name: Setup validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Setup test configuration
        run: |
          cp config/config.env.example config/config.env
          sed -i 's/your-remote-database-host/127.0.0.1/g' config/config.env
          sed -i 's/your-remote-username/root/g' config/config.env
          sed -i 's/your-remote-password/test_password/g' config/config.env
          sed -i 's/your-local-mysql-password/test_password/g' config/config.env
          sed -i 's/database1,database2,database3/test_db/g' config/config.env

      - name: Run setup validation
        run: |
          chmod +x scripts/*.sh setup.sh
          ./setup.sh --test

      - name: Configuration loads
        run: |
          source scripts/config_loader.sh
          load_config "./config/config.env"
